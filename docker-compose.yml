services:
  fastapi:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  
DOCKER COMPOSE — простыми словами

Docker Compose нужен для того, чтобы
запускать несколько Docker-контейнеров вместе
и настраивать, как они должны работать друг с другом.

Например, в нашем проекте есть:

FastAPI
   +
PostgreSQL

Вместо того чтобы запускать и настраивать
каждый контейнер отдельно, мы описываем всё
в одном файле:

docker-compose.yml


Что мы указываем в docker-compose.yml:

- какие контейнеры нужны;
- какой image использовать;
- какие порты открыть;
- какие переменные окружения передать;
- как контейнеры должны взаимодействовать друг с другом;
- какие данные нужно сохранить.


#Например:

#FastAPI
   ↓
#подключается к
   ↓
#PostgreSQL


#Как это работает:

#1. Создаём файл:

#docker-compose.yml

#2. Описываем в нём наши сервисы.

#Например:

#services:

 #   FastAPI
  #  PostgreSQL


#3. Запускаем:

#docker compose up --build


#Docker Compose:

#→ создаёт необходимые контейнеры
#→ запускает FastAPI
#→ запускает PostgreSQL
#→ соединяет их между собой


#Если нужно остановить:

#docker compose down


#Главная идея:

#Dockerfile
#→ описывает, КАК собрать контейнер
#для нашего приложения.

#Docker Compose
#→ описывает, КАК ЗАПУСТИТЬ ВСЮ СИСТЕМУ
#из нескольких контейнеров.


#Простая аналогия:

#Dockerfile — инструкция,
#как собрать один автомобиль.

#Docker Compose — инструкция,
#как поставить несколько автомобилей
#в одну систему и заставить их работать вместе.


#В нашем проекте:

#Dockerfile
#→ собирает FastAPI-приложение.

#docker-compose.yml
#→ запускает FastAPI + PostgreSQL
#и соединяет их между собой.


#Коротко для памяти:

#Dockerfile → КАК СОБРАТЬ контейнер.

#Docker Compose → КАК ЗАПУСТИТЬ несколько контейнеров вместе.