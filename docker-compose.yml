services:
  fastapi:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  
DOCKER COMPOSE — простыми словами

Docker Compose нужен для того, чтобы
запускать несколько Docker-контейнеров вместе
и настраивать, как они должны работать друг с другом.

Например, в нашем проекте есть:

FastAPI
   +
PostgreSQL

Вместо того чтобы запускать и настраивать
каждый контейнер отдельно, мы описываем всё
в одном файле:

docker-compose.yml


Что мы указываем в docker-compose.yml:

- какие контейнеры нужны;
- какой image использовать;
- какие порты открыть;
- какие переменные окружения передать;
- как контейнеры должны взаимодействовать друг с другом;
- какие данные нужно сохранить.



